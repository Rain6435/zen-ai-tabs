<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zen AI Tabs</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <div class="mark" aria-hidden="true">Z</div>
  <div>
    <h1>Zen AI Tabs</h1>
    <div class="subtitle">Group ungrouped tabs with AI</div>
  </div>
</header>

<main class="card">
  <label class="field">
    <span>Provider</span>
    <select id="provider">
      <option value="gemini">Google Gemini</option>
      <option value="claude">Anthropic Claude</option>
      <option value="openai">OpenAI</option>
      <option value="local">Firefox on-device (experimental)</option>
    </select>
  </label>

  <label class="field" id="keyField">
    <span>API key</span>
    <input id="key" type="password" autocomplete="off" spellcheck="false">
    <span class="hint">Stored locally in this browser only.</span>
  </label>

  <label id="oauthRow" class="switch" hidden>
    <span>Claude OAuth (Pro/Max), not an API key</span>
    <input id="oauthToggle" type="checkbox">
    <span class="track" aria-hidden="true"></span>
  </label>
  <div id="oauthInfo" class="hint" hidden></div>

  <label class="field" id="modelField">
    <span>Model</span>
    <input id="model" type="text" autocomplete="off" spellcheck="false">
    <span class="hint">Leave blank for the default.</span>
  </label>
</main>

<div class="actions">
  <button id="tidy" class="primary">Tidy ungrouped</button>
  <button id="undo" class="ghost">Undo</button>
</div>

<div id="status" role="status" aria-live="polite"></div>

<script type="module" src="popup.js"></script>
</body>
</html>
